<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Incazzo Wheel</title>
</head>
<body>
    <div id="menu-container">
        <button id="menu-toggle" title="Manage entries">&#9776;</button>
        <div id="menu-panel" class="open">
            <h3>Con chi mi incazzo oggi?</h3>
            <ul id="entries-list"></ul>
            <div id="add-area">
                <input id="add-input" type="text" placeholder="..." maxlength="50" />
                <button id="add-btn">+</button>
            </div>
        </div>
    </div>
    <canvas id="canvas"></canvas>
    <button id="spin-btn" title="Spin!"></button>
    <div id="winner-label"></div>

    <script type="module" src="main.js"></script>
</body>
</html>
